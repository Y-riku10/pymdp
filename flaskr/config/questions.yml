# questions.yml

#　各質問のtextは消して、ラベルだけを提示するのでよいかも
# 一般に使われる形容詞対を調べる

# 動きの評価
# 質問の文章を消して、ラベルだけを提示するバージョン
# 本多さんの実験に寄せたバージョン
# 本多さんはinterestの反対をboredomとし、退屈-面白さの2極で質問していたが、
# この質問では退屈ではないが面白くもない動き（ただ激しいだけの動き）でも面白いと評価せざるを得なかったのでは？
# 現に、vfeに対して面白さが単調に増加する結果となっていた。

questions:
  - id: q1
    category: Motion_Eval
    data_key: interest
    text: "この動きは面白いですか？"
    type: sd7
    labels: ["全く面白くない", "やや面白くない", "どちらともいえない", "やや面白い", "とても面白い"]
    score_values: [1, 2, 3, 4, 5, 6, 7]
    note: "印象に残りやすく興味深い"

  - id: q2
    category: Motion_Eval
    data_key: boredom
    text: "この動きは退屈ですか？"
    type: sd7
    labels: ["全く退屈しない", "あまり退屈しない", "どちらともいえない", "やや退屈する", "とても退屈する"]
    score_values: [1, 2, 3, 4, 5, 6, 7]
    note: "単調でつまらない"

  - id: q3
    category: Motion_Eval
    data_key: confusion
    text: "この動きは混乱しやすいですか？"
    type: sd7
    labels: ["全く混乱しない", "あまり混乱しない", "どちらともいえない", "やや混乱する", "とても混乱する"]
    score_values: [1, 2, 3, 4, 5, 6, 7]
    note: "脈絡がなく理解できない"

  - id: q4
    category: Motion_Eval
    data_key: predictibity
    text: "この動きは予測しやすいですか？"
    type: sd7
    labels: ["全く予測しやすくない", "あまり予測しやすくない", "どちらともいえない", "やや予測しやすい", "とても予測しやすい"]
    score_values: [1, 2, 3, 4, 5, 6, 7]
    note: "どこへ向かうか分かりやすい"

  - id: q5
    category: Motion_Eval
    data_key: beauty
    text: "この動きは美しいですか？"
    type: sd7
    labels: ["全く美しくない", "あまり美しくない", "どちらともいえない", "やや美しい", "とても美しい"]
    score_values: [1, 2, 3, 4, 5, 6, 7]
    note: "優雅で洗練されている"

