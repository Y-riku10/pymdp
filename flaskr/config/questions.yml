# 知的好奇心尺度（西川一二・雨宮俊彦, 2015）
questions_curiosity:
  # 拡散的好奇心 (Diversive Curiosity: DC)
  - id: IC_DC1
    category: Curiosity_Scale
    data_key: dc_diversive1
    text: "新しいことに挑戦することは好きだ"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "新奇性への積極的な関心を測定（拡散的好奇心）"

  - id: IC_DC2
    category: Curiosity_Scale
    data_key: dc_diversive2
    text: "誰もやったことのない物事にとても興味がある"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "新奇・未知への探索意欲を測定（拡散的好奇心）"

  - id: IC_DC3
    category: Curiosity_Scale
    data_key: dc_diversive3
    text: "どこに行っても、新しい物事や経験を探す"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "新しい刺激や体験を求める傾向を測定（拡散的好奇心）"

  - id: IC_DC4
    category: Curiosity_Scale
    data_key: dc_diversive4
    text: "今までやったことのない課題にもよろこんで取り組める"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "課題への挑戦意欲を測定（拡散的好奇心）"

  - id: IC_DC5
    category: Curiosity_Scale
    data_key: dc_diversive5
    text: "新しいアイデアをあれこれ考える"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "発想の柔軟性や創造的探索を測定（拡散的好奇心）"

  - id: IC_DC6
    category: Curiosity_Scale
    data_key: dc_diversive6
    text: "何事にも興味関心が強い"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "広範な興味の強さを測定（拡散的好奇心）"

  # 特殊的好奇心 (Specific Curiosity: SC)
  - id: IC_SC1
    category: Curiosity_Scale
    data_key: sc_specific1
    text: "はっきりした明快な答えが出るまでずっと考える"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "知的な問題解決への粘り強さを測定（特殊的好奇心）"

  - id: IC_SC2
    category: Curiosity_Scale
    data_key: sc_specific2
    text: "解答を理解できないと気持ちが落ち着かず、なんとか理解しなければと思う"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "理解への欲求と未解決状態の不快感を測定（特殊的好奇心）"

  - id: IC_SC3
    category: Curiosity_Scale
    data_key: sc_specific3
    text: "物事を学ぶ時には、徹底的に調べたい"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "学習過程での深い探究志向を測定（特殊的好奇心）"

  - id: IC_SC4
    category: Curiosity_Scale
    data_key: sc_specific4
    text: "予期しない出来事が起きた時、原因がわかるまで調べる"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "不確実性や矛盾に対する解明欲求を測定（特殊的好奇心）"

  - id: IC_SC5
    category: Curiosity_Scale
    data_key: sc_specific5
    text: "ある考えを理解するために必要な知識をすべて学ばないと満足できない"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "完全な理解を目指す傾向を測定（特殊的好奇心）"

  - id: IC_SC6
    category: Curiosity_Scale
    data_key: sc_specific6
    text: "問題を解くために長時間じっくり考える"
    type: sd5
    labels: ["まったくあてはまらない", "あまりあてはまらない", "どちらともいえない", "ややあてはまる", "とてもよくあてはまる"]
    score_values: [1, 2, 3, 4, 5]
    note: "粘り強い問題解決姿勢を測定（特殊的好奇心）"
